name: Sync CMP from TaekGyu0801/GGYU

on:
  push:
    paths:
      - ".github/workflows/sync-cmp.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-cmp-from-ggyu
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Subin mirror
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch canonical CMP tree
        run: |
          rm -rf /tmp/ggyu
          git clone --depth 1 --filter=blob:none --sparse https://github.com/TaekGyu0801/GGYU.git /tmp/ggyu
          git -C /tmp/ggyu sparse-checkout set CMP

      - name: Mirror CMP files
        run: |
          mkdir -p CMP
          rsync -a --delete /tmp/ggyu/CMP/ CMP/

      - name: Mirror LIVE LOG Issue #7 comments
        run: |
          python3 - <<'PY'
          import json, urllib.request
          comments = []
          page = 1
          while True:
              url = f"https://api.github.com/repos/TaekGyu0801/GGYU/issues/7/comments?per_page=100&page={page}"
              req = urllib.request.Request(url, headers={"User-Agent": "CMP-sync"})
              with urllib.request.urlopen(req) as r:
                  batch = json.load(r)
              if not batch:
                  break
              comments.extend(batch)
              if len(batch) < 100:
                  break
              page += 1
          out = [
              "# LIVE LOG Issue #7 mirror",
              "",
              "> Canonical source: TaekGyu0801/GGYU Issue #7",
              "> Auto-generated by .github/workflows/sync-cmp.yml. Do not edit manually.",
              "",
          ]
          for c in comments:
              out += [
                  f"## {c.get('created_at','')} — {c.get('user',{}).get('login','unknown')}",
                  "",
                  c.get("body") or "",
                  "",
                  "---",
                  "",
              ]
          with open("CMP/.ai-sync/LIVE_LOG_ISSUE_7_MIRROR.md", "w", encoding="utf-8") as f:
              f.write("\n".join(out))
          PY

      - name: Commit and push only when changed
        run: |
          if git diff --quiet -- CMP && git diff --cached --quiet; then
            echo "No CMP changes."
            exit 0
          fi
          git config user.name "CMP Sync Bot"
          git config user.email "actions@users.noreply.github.com"
          git add CMP
          git commit -m "sync: mirror canonical CMP from TaekGyu0801/GGYU"
          git push
